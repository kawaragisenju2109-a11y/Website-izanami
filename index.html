<script>
    function sapaUser() {
        // 1. Meminta input nama
        let nama = prompt("Siapa nama kamu?");
        
        // 2. Cek apakah user mengisi nama atau menekan batal
        if (nama !== null && nama !== "") {
            console.log("Nama yang dimasukkan: " + nama); // Cek di console browser

            // 3. Mengambil elemen berdasarkan ID
            let elemenJudul = document.getElementById("nama-user");

            if (elemenJudul) {
                // 4. Mengganti teksnya
                elemenJudul.innerHTML = "Halo, " + nama + "!";
                alert("Berhasil! Selamat datang, " + nama);
            } else {
                // Jika ID "nama-user" tidak ditemukan di HTML
                console.error("Kesalahan: Elemen dengan ID 'nama-user' tidak ditemukan!");
                alert("Waduh, ada bagian kode yang hilang di HTML-mu.");
            }
        }
    }
</script>
